<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="知人镜智能识人：伦理门禁后的多透镜合成参考。" />
  <title>智能识人 · 知人镜</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span>知人镜</span></a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="kb.html">知识库</a>
        <a href="ask.html" aria-current="page">智能识人</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="page-intro">
      <h1>智能识人</h1>
      <p class="lead">
        写下对方的基本情况与你的核心诉求。系统会先做<strong>正见门禁</strong>，再组合知识库透镜，给出可验证的假设与抱持建议。
        全程可离线运行；结果不是诊断，更不是操控手册。
      </p>
    </header>

    <form id="ask-form" class="ask-form" novalidate>
      <div>
        <label class="field-label" for="person-input">对方基本情况</label>
        <textarea id="person-input" name="person" required
          placeholder="例：合作半年的朋友，最近频繁提及一个「稳赚」项目，催我本周内决定是否出资，细节口头说很多但书面材料很少……"></textarea>
      </div>
      <div>
        <label class="field-label" for="intent-input">我的核心诉求</label>
        <textarea id="intent-input" name="intent" required
          placeholder="例：想判断是否值得信任与合作，如何防骗自保，同时尽量不伤害这份友谊。"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" id="ask-submit">开始看见</button>
        <p class="form-hint">允许：防骗、理解冲突、改善沟通、评估匹配、支持对方。<br />拒绝：操控、欺骗、报复、跟踪等伤害意图。</p>
      </div>
    </form>

    <div id="ask-result" tabindex="-1" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>知人镜 · 看见是为了抱持，不是为了操控</p>
  </footer>
  <script src="js/kb.js"></script>
  <script src="js/ethics.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
